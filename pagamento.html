<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S.M.A | Faturas Mensais</title>

<link rel="shortcut icon" href="Logo da sma Soluções.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =====================================
        RESET
===================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    min-height:100vh;

    background:
    radial-gradient(
        circle at top,
        #2563eb,
        #050816 70%
    );

    color:white;

    display:flex;

    flex-direction:column;

    align-items:center;

}


/* =====================================
        HEADER
===================================== */

header{

    width:100%;

    padding:25px;

    display:flex;

    justify-content:center;

    background:rgba(0,0,0,.3);

    backdrop-filter:blur(10px);

}

header img{

    width:200px;

}


/* =====================================
        FORMULÁRIO
===================================== */

.formulario{

    width:90%;

    max-width:700px;

    margin:50px auto;

    background:white;

    color:#0f172a;

    padding:45px;

    border-radius:30px;

    box-shadow:
    0 25px 60px rgba(0,0,0,.4);

    animation:
    aparecer .8s ease;

}

.formulario h1{

    text-align:center;

    color:#2563eb;

    font-size:35px;

    margin-bottom:10px;

}

.formulario > p{

    text-align:center;

    color:#64748b;

    margin-bottom:35px;

}


/* =====================================
        FORM
===================================== */

form{

    display:flex;

    flex-direction:column;

    gap:12px;

}

label{

    font-weight:600;

    margin-top:10px;

}

input,
select{

    width:100%;

    padding:15px;

    border-radius:12px;

    border:1px solid #cbd5e1;

    outline:none;

    font-size:16px;

    font-family:'Poppins',sans-serif;

    transition:.3s;

    background:white;

}

input:focus,
select:focus{

    border-color:#2563eb;

    box-shadow:
    0 0 10px rgba(37,99,235,.3);

}


/* =====================================
        BOTÕES
===================================== */

button{

    margin-top:20px;

    padding:16px;

    border:none;

    border-radius:40px;

    background:#2563eb;

    color:white;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    transition:.3s;

    font-family:'Poppins',sans-serif;

}

button:hover{

    background:#1d4ed8;

    transform:translateY(-5px);

    box-shadow:
    0 15px 30px rgba(37,99,235,.4);

}


/* =====================================
        FATURA
===================================== */

#fatura{

    margin-top:30px;

    padding:30px;

    border-radius:20px;

    background:#f8fafc;

    border:1px solid #e2e8f0;

    display:none;

}


.fatura-topo{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:20px;

    padding-bottom:20px;

    border-bottom:2px solid #2563eb;

}


.fatura-titulo h2{

    color:#2563eb;

    font-size:28px;

}


.fatura-titulo p{

    color:#64748b;

    font-size:13px;

}


.numero-fatura{

    text-align:right;

    font-size:13px;

    color:#64748b;

}


.numero-fatura strong{

    display:block;

    color:#0f172a;

    font-size:16px;

}


/* =====================================
        DADOS
===================================== */

.dados{

    margin-top:25px;

}


.info{

    display:flex;

    justify-content:space-between;

    gap:15px;

    padding:12px 0;

    border-bottom:1px solid #e2e8f0;

}


.info strong{

    color:#334155;

}


.info span{

    text-align:right;

    color:#0f172a;

}


/* =====================================
        TOTAL
===================================== */

.total{

    margin-top:15px;

    padding:18px;

    border-radius:12px;

    background:#eff6ff;

    color:#2563eb;

    display:flex;

    justify-content:space-between;

    font-size:21px;

    font-weight:700;

}


/* =====================================
        ESTADO
===================================== */

.estado{

    margin-top:20px;

    padding:12px;

    border-radius:12px;

    text-align:center;

    font-weight:700;

}

.estado.pago{

    background:#dcfce7;

    color:#15803d;

}

.estado.pendente{

    background:#fef3c7;

    color:#a16207;

}


/* =====================================
        CÓDIGO
===================================== */

.codigo-box{

    margin-top:25px;

    padding:20px;

    border:2px dashed #94a3b8;

    border-radius:15px;

    text-align:center;

    background:white;

}

.codigo-box small{

    display:block;

    color:#64748b;

    margin-bottom:8px;

}

.codigo{

    color:#0f172a;

    font-size:18px;

    font-weight:800;

    letter-spacing:2px;

    word-break:break-all;

}


/* =====================================
        RODAPÉ
===================================== */

.fatura-footer{

    margin-top:25px;

    padding-top:20px;

    border-top:1px solid #e2e8f0;

    text-align:center;

    color:#64748b;

    font-size:12px;

}


/* =====================================
        BOTÃO IMPRIMIR
===================================== */

#btnImprimir{

    width:100%;

    background:#16a34a;

}

#btnImprimir:hover{

    background:#15803d;

}


/* =====================================
        ANIMAÇÃO
===================================== */

@keyframes aparecer{

    from{

        opacity:0;

        transform:translateY(40px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


/* =====================================
        RESPONSIVO
===================================== */

@media(max-width:600px){

    .formulario{

        padding:25px;

    }

    .formulario h1{

        font-size:28px;

    }

    header img{

        width:150px;

    }

    .fatura-topo{

        flex-direction:column;

    }

    .numero-fatura{

        text-align:left;

    }

    .info{

        flex-direction:column;

        gap:3px;

    }

    .info span{

        text-align:left;

    }

    .total{

        flex-direction:column;

        gap:5px;

    }

}


/* =====================================
        IMPRESSÃO
===================================== */

@media print{

    body{

        background:white;

        color:#000;

    }

    header{

        background:white;

        backdrop-filter:none;

    }

    header img{

        width:150px;

    }

    .formulario{

        width:100%;

        max-width:none;

        margin:0;

        padding:20px;

        box-shadow:none;

        border:1px solid #ddd;

    }

    .formulario > h1,
    .formulario > p,
    form,
    #btnImprimir{

        display:none !important;

    }

    #fatura{

        display:block !important;

        border:1px solid #000;

        background:white;

        margin:0;

    }

}
img{
    width: 50px;
}

</style>

</head>


<body>


<header>

    <img
        src="Logo da sma Soluções.png"
        alt="S.M.A"
    >

</header>


<main class="formulario">

    <h1>
        Faturas Mensais
    </h1>

    <p>
        Preencha os dados para gerar a fatura mensal.
    </p>


    <form onsubmit="gerarFatura(event)">


        <!-- =================================
                NOME
        ================================== -->

        <label for="nome">
            Nome completo
        </label>

        <input
            type="text"
            id="nome"
            placeholder="Digite o nome completo"
            required
        >


        <!-- =================================
                CURSO
        ================================== -->

        <label for="curso">
            Curso
        </label>

        <select
            id="curso"
            required
        >

            <option value="">
                Selecione o curso
            </option>


            <!-- CURSOS -->

            <option value="Inglês">
                Inglês
            </option>

            <option value="Informática">
                Informática
            </option>

            <option value="Contabilidade">
                Contabilidade
            </option>

            <option value="Gestão">
                Gestão
            </option>

            <option value="Marketing">
                Marketing
            </option>


            <!-- PROGRAMAÇÃO -->

            <option value="Programação">
                Programação
            </option>

            <option value="Programação Web">
                Programação Web
            </option>

            <option value="HTML e CSS">
                HTML e CSS
            </option>

            <option value="JavaScript">
                JavaScript
            </option>

            <option value="Python">
                Python
            </option>

            <option value="Java">
                Java
            </option>

            <option value="Desenvolvimento de Software">
                Desenvolvimento de Software
            </option>


            <option value="Outro">
                Outro
            </option>

            
<option value=" Oratoria" >



   Oratoria
    
</option>


<option value="Exel">


   Exel
</option>
             

<option value="Resdes de computadores">
    Redes de computador 
</option>
             

<option value="Eletronica">


    Eletronica
</option>
             
<option value="Hardwere e Software">
    Hardwere e Software
</option>
             
<option value="Secretariado">
    Secretariado
</option>

<option value="Contabilidade">
    Contabilidade
</option>
             
<option value="Administração de empresas" >
    Administração de empresas
</option>
<option value="Primavera">
    Primavera
</option>

        </select>


        <!-- =================================
                MÊS
        ================================== -->

        <label for="mes">
            Mês da fatura
        </label>

        <select
            id="mes"
            required
        >

            <option value="">
                Selecione o mês
            </option>

            <option value="Janeiro">
                Janeiro
            </option>

            <option value="Fevereiro">
                Fevereiro
            </option>

            <option value="Março">
                Março
            </option>

            <option value="Abril">
                Abril
            </option>

            <option value="Maio">
                Maio
            </option>

            <option value="Junho">
                Junho
            </option>

            <option value="Julho">
                Julho
            </option>

            <option value="Agosto">
                Agosto
            </option>

            <option value="Setembro">
                Setembro
            </option>

            <option value="Outubro">
                Outubro
            </option>

            <option value="Novembro">
                Novembro
            </option>

            <option value="Dezembro">
                Dezembro
            </option>

        </select>


        <!-- =================================
                VALOR
        ================================== -->

        <label for="valor">
            Valor da mensalidade
        </label>

        <input
            type="number"
            id="valor"
            min="100"
            placeholder="Ex.: 10000"
            required
        >


        <!-- =================================
                ESTADO
        ================================== -->

        <label for="estado">
            Estado do pagamento
        </label>

        <select
            id="estado"
            required
        >

            <option value="Pago">
                Pago
            </option>

            <option value="Pendente">
                Pendente
            </option>

        </select>


        <button type="submit">

            Gerar fatura

        </button>

    </form>


    <!-- =================================
            FATURA GERADA
    ================================== -->

    <div id="fatura">


        <div class="fatura-topo">


            <div class="fatura-titulo">

                <h2>
                    FATURA
                </h2>

                <p>
                    S.M.A Soluções
                </p>

            </div>


            <div class="numero-fatura">

                Nº da fatura:

                <strong id="mostrarNumero">
                </strong>

            </div>


        </div>


        <div class="dados">


            <div class="info">

                <strong>
                    Cliente:
                </strong>

                <span id="mostrarNome">
                </span>

            </div>


            <div class="info">

                <strong>
                    Curso:
                </strong>

                <span id="mostrarCurso">
                </span>

            </div>


            <div class="info">

                <strong>
                    Mês de referência:
                </strong>

                <span id="mostrarMes">
                </span>

            </div>


            <div class="info">

                <strong>
                    Data de emissão:
                </strong>

                <span id="mostrarData">
                </span>

            </div>


            <div class="total">

                <strong>
                    Total:
                </strong>

                <span id="mostrarValor">
                </span>

            </div>


            <div
                id="mostrarEstado"
                class="estado"
            >

            </div>


            <div class="codigo-box">

                <small>
                    CÓDIGO DE AUTENTICIDADE
                </small>

                <div
                    id="mostrarCodigo"
                    class="codigo"
                >
                </div>

            </div>


        </div>


        <div class="fatura-footer">

            S.M.A Soluções

            <br>

            Documento emitido eletronicamente.

            <br>

            Guarde o código para verificar a autenticidade desta fatura.

        </div>
           <img src="YAMY.jpeg" alt="">

        <button
            type="button"
            id="btnImprimir"
            onclick="imprimirFatura()"
        >

            🖨️ Imprimir / Guardar PDF

        </button>


    </div>


</main>


<script>


/* =====================================
        FORMATAR KZ
===================================== */

function formatarKz(valor){

    return Number(valor)
        .toLocaleString("pt-AO") + " Kz";

}


/* =====================================
        GERAR CÓDIGO
===================================== */

function gerarCodigo(){

    const array =
        new Uint32Array(4);

    crypto.getRandomValues(array);

    const partes =
        Array.from(array).map(
            numero =>
            numero
            .toString(36)
            .toUpperCase()
        );

    return "SMA-" +

        partes[0].substring(0,6) +

        "-" +

        partes[1].substring(0,6) +

        "-" +

        partes[2].substring(0,6) +

        "-" +

        partes[3].substring(0,6);

}


/* =====================================
        NÚMERO DA FATURA
===================================== */

function gerarNumeroFatura(){

    const agora =
        new Date();

    const ano =
        agora.getFullYear();

    const numero =
        Math.floor(
            100000 +
            Math.random() * 900000
        );

    return "SMA-" +
        ano +
        "-" +
        numero;

}


/* =====================================
        GERAR FATURA
===================================== */

function gerarFatura(event){

    event.preventDefault();


    const nome =
        document
        .getElementById("nome")
        .value
        .trim();


    const curso =
        document
        .getElementById("curso")
        .value;


    const mes =
        document
        .getElementById("mes")
        .value;


    const valor =
        document
        .getElementById("valor")
        .value;


    const estado =
        document
        .getElementById("estado")
        .value;


    if(
        !nome ||
        !curso ||
        !mes ||
        !valor
    ){

        alert(
            "Preencha todos os campos."
        );

        return;

    }


    /* ================================
            DATA
    ================================= */

    const data =
        new Date();


    const dataFormatada =
        data.toLocaleDateString(
            "pt-AO",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric"
            }
        );


    /* ================================
            PREENCHER
    ================================= */

    document
    .getElementById("mostrarNome")
    .innerText = nome;


    document
    .getElementById("mostrarCurso")
    .innerText = curso;


    document
    .getElementById("mostrarMes")
    .innerText = mes;


    document
    .getElementById("mostrarData")
    .innerText = dataFormatada;


    document
    .getElementById("mostrarValor")
    .innerText =
        formatarKz(valor);


    document
    .getElementById("mostrarNumero")
    .innerText =
        gerarNumeroFatura();


    document
    .getElementById("mostrarCodigo")
    .innerText =
        gerarCodigo();


    /* ================================
            ESTADO
    ================================= */

    const estadoElemento =
        document
        .getElementById("mostrarEstado");


    estadoElemento.innerText =
        "Estado: " + estado;


    estadoElemento.className =
        "estado " +
        (
            estado === "Pago"
            ? "pago"
            : "pendente"
        );


    /* ================================
            MOSTRAR
    ================================= */

    document
    .getElementById("fatura")
    .style.display = "block";


    document
    .getElementById("fatura")
    .scrollIntoView({
        behavior:"smooth"
    });

}


/* =====================================
        IMPRIMIR
===================================== */

function imprimirFatura(){
     alert("imprimir pdf ")
    window.print();

}

</script>


</body>

</html>
